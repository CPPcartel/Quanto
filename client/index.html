<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090d" />

    <title>Quanto: the skyline is the chart</title>
    <meta
      name="description"
      content="A multiplayer city where every tower is a real company and its height is that company's live share price, read from Chainlink on Robinhood Chain. Free to play, no wallet needed."
    />

    <!--
      Link previews. These are what render when someone drops the URL in X or
      Telegram, so they matter more than almost anything else on the page.
      Set og:url to the real domain, and drop a 1200x630 og.png in public/.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quanto" />
    <meta property="og:title" content="Quanto: the skyline is the chart" />
    <meta
      property="og:description"
      content="Every tower is a real company. Its height is the live share price. Walk through a market instead of looking at one."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:url" content="https://quanto.city" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quanto: the skyline is the chart" />
    <meta
      name="twitter:description"
      content="Every tower is a real company. Its height is the live share price. Walk through a market instead of looking at one."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
