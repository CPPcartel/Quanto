<title>Quanto City cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=JetBrains+Mono:wght@500&display=swap"
  rel="stylesheet"
/>

<style>
  /*
    1500 x 1500, the whole collection behind the name.

    The mosaic is 3,364 residents at 8 logical pixels each, and at full strength
    it is unreadable noise that fights anything placed on top. Dimming it is not
    a stylistic softening: it converts a wall of detail into a texture, which is
    what lets a crowd read as a crowd and a wordmark read as a wordmark.

    Two layers do that. A flat scrim drops the whole field, and a radial pool
    darkens the middle further so the type sits on its own ground rather than on
    someone's face. Everything else is the game's own palette.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #11131a;
    --amber: #e5a85c;
    --text: #ecedf3;
    --muted: #9ba1b2;
    --faint: #676d7d;
  }

  body {
    width: 1500px;
    height: 1500px;
    background: var(--ink);
    position: relative;
    overflow: hidden;
    font-family: Archivo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /*
    Nearest-neighbour, explicitly.

    The mosaic is already at its final pixel size, but a browser that decides to
    smooth it would undo the entire point of building it on integer ratios.
  */
  .field {
    position: absolute;
    inset: 0;
    background-image: url("out/mosaic.png");
    background-size: 1500px 1500px;
    image-rendering: pixelated;
    opacity: 0.32;
  }

  /* The pool the type sits in. */
  .pool {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(58% 42% at 50% 50%, rgba(17, 19, 26, 0.94) 0%, rgba(17, 19, 26, 0.72) 45%, rgba(17, 19, 26, 0) 78%),
      radial-gradient(120% 120% at 50% 50%, rgba(17, 19, 26, 0) 55%, rgba(17, 19, 26, 0.85) 100%);
  }

  /* A single amber wash, so the crowd is lit rather than grey. */
  .warm {
    position: absolute;
    inset: 0;
    background: radial-gradient(70% 55% at 50% 46%, rgba(229, 168, 92, 0.13) 0%, rgba(229, 168, 92, 0) 70%);
  }

  .plate {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    text-align: center;
  }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: var(--amber);
    /* The letter-spacing pushes the block right; pull it back to true centre. */
    text-indent: 0.44em;
  }

  h1 {
    font-size: 224px;
    font-weight: 900;
    letter-spacing: -0.045em;
    line-height: 0.82;
    color: var(--text);
    text-shadow:
      0 0 140px rgba(17, 19, 26, 0.9),
      0 0 60px rgba(229, 168, 92, 0.22);
  }
  h1 span { display: block; }

  .rule {
    width: 120px;
    height: 5px;
    background: var(--amber);
  }

  .tag {
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.012em;
    color: var(--muted);
  }
  .tag b { color: var(--text); font-weight: 800; }

  /*
    The footer sits outside the central pool, on the brightest part of the
    crowd, and at --faint it was unreadable. It gets its own scrim and a
    brighter ink rather than being moved: the bottom edge is where a caption
    belongs, and a line nobody can read is not a caption.
  */
  .foot-scrim {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 240px;
    background: linear-gradient(180deg, rgba(17, 19, 26, 0) 0%, rgba(17, 19, 26, 0.92) 62%);
  }

  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 74px;
    display: flex;
    justify-content: center;
    gap: 42px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 21px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>

<div class="field"></div>
<div class="pool"></div>
<div class="warm"></div>

<div class="plate">
  <div class="eyebrow">3,338 residents</div>
  <h1><span>QUANTO</span><span>CITY</span></h1>
  <div class="rule"></div>
  <div class="tag">The skyline <b>is</b> the chart.</div>
</div>

<div class="foot-scrim"></div>

<div class="foot">
  <span>38 live feeds</span>
  <span>Robinhood Chain</span>
</div>
