<title>Quanto City header</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=JetBrains+Mono:wght@500&display=swap"
  rel="stylesheet"
/>

<style>
  /*
    X header, 1500x500, with the whole collection behind the name.

    Three constraints shape this and none of them are aesthetic.

    The avatar punches a hole in the bottom-left, roughly 200px square once the
    ring and its offset are allowed for, so nothing that must be read may live
    there. X crops the height aggressively on narrow screens, biting from top
    and bottom, so the wordmark sits on the vertical centre line. And the field
    behind it is 5,250 faces: at full strength that is unreadable noise which
    fights anything placed on top, so it is dimmed to a texture. That is not
    softening for its own sake — it is what lets a crowd read as a crowd and a
    wordmark read as a wordmark.

    Palette is the game's own, from client/src/styles.css.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #11131a;
    --amber: #e5a85c;
    --text: #ecedf3;
    --muted: #9ba1b2;
  }

  body {
    width: 1500px;
    height: 500px;
    background: var(--ink);
    position: relative;
    overflow: hidden;
    font-family: Archivo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /*
    The wide mosaic is written into the top band of a square PNG, because the
    collection's encoder only writes squares. Anchoring to the top shows the
    band and hides the unused remainder.

    image-rendering is not optional here: the art is already at its final pixel
    size, and a browser that decided to smooth it would undo the whole reason
    the grid was built on integer ratios.
  */
  .field {
    position: absolute;
    inset: 0;
    background-image: url("out/mosaic-wide.png");
    background-size: 1500px 1500px;
    background-position: top left;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    /*
     * 0.58, not the 0.34 the square cover uses.
     *
     * The square has 24px faces and can afford to be a whisper. Here they are
     * 12px, and at a third strength they stopped reading as people and became
     * grain — which loses the only thing the header is actually showing. The
     * scrim below does the legibility work instead, in the one place type sits.
     */
    opacity: 0.58;
  }

  /* The pool the type sits in, pulled left so the wordmark has its own ground. */
  .pool {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(34% 92% at 22% 50%, rgba(17, 19, 26, 0.96) 0%, rgba(17, 19, 26, 0.80) 52%, rgba(17, 19, 26, 0) 86%),
      linear-gradient(90deg, rgba(17, 19, 26, 0.94) 0%, rgba(17, 19, 26, 0.62) 22%, rgba(17, 19, 26, 0) 44%);
  }

  /* One amber wash, so the crowd is lit rather than grey. */
  .warm {
    position: absolute;
    inset: 0;
    background: radial-gradient(74% 120% at 68% 55%, rgba(229, 168, 92, 0.14) 0%, rgba(229, 168, 92, 0) 78%);
  }

  /* Top and bottom, because X crops from both on narrow screens. */
  .edges {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(17, 19, 26, 0.7) 0%, rgba(17, 19, 26, 0) 22%),
      linear-gradient(0deg, rgba(17, 19, 26, 0.7) 0%, rgba(17, 19, 26, 0) 22%);
  }

  .plate {
    position: absolute;
    left: 96px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
  }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 18px;
  }

  h1 {
    font-size: 104px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.86;
    color: var(--text);
    text-shadow: 0 0 110px rgba(17, 19, 26, 0.95), 0 0 50px rgba(229, 168, 92, 0.2);
  }
  h1 span { display: block; }

  .rule {
    width: 88px;
    height: 4px;
    margin: 22px 0 18px;
    background: var(--amber);
  }

  .tag {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -0.012em;
    color: var(--muted);
  }
  .tag b { color: var(--text); font-weight: 800; }

  /* Top-right, clear of the avatar hole in the opposite corner. */
  .meta {
    position: absolute;
    right: 60px;
    top: 42px;
    z-index: 5;
    display: flex;
    gap: 26px;
    align-items: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 1px 10px rgba(17, 19, 26, 0.95);
  }
  .meta span { display: flex; align-items: center; gap: 9px; }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #5fb37e;
    box-shadow: 0 0 12px #5fb37e;
  }
</style>

<div class="field"></div>
<div class="pool"></div>
<div class="warm"></div>
<div class="edges"></div>

<div class="plate">
  <div class="eyebrow">3,338 residents</div>
  <h1><span>QUANTO</span><span>CITY</span></h1>
  <div class="rule"></div>
  <div class="tag">The skyline <b>is</b> the chart.</div>
</div>

<div class="meta">
  <span><i class="dot"></i>38 feeds live</span>
  <span>Robinhood Chain</span>
</div>
